<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Movie Download</title>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
    font-family:Arial,sans-serif;
}

body{
    background:#0b0b0b;
    color:white;
    padding:15px;
}

.container{
    max-width:450px;
    margin:auto;
}

.movie-card{
    background:#171717;
    border-radius:18px;
    overflow:hidden;
    box-shadow:0 5px 25px rgba(0,0,0,.5);
}

.thumbnail{
    width:100%;
    height:250px;
    object-fit:cover;
    display:block;
}

.movie-info{
    padding:18px;
}

.movie-title{
    font-size:23px;
    font-weight:bold;
    margin-bottom:12px;
}

.details{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:10px;
    margin-bottom:18px;
}

.detail{
    background:#222;
    border-radius:10px;
    padding:12px;
}

.label{
    color:#999;
    font-size:12px;
    margin-bottom:5px;
}

.value{
    font-size:15px;
    font-weight:bold;
}

.download-btn{
    width:100%;
    border:0;
    border-radius:12px;
    padding:15px;
    background:#e50914;
    color:white;
    font-size:17px;
    font-weight:bold;
    cursor:pointer;
}

.download-btn:active{
    transform:scale(.98);
}

.note{
    text-align:center;
    color:#888;
    font-size:12px;
    margin-top:12px;
}
</style>
</head>

<body>

<div class="container">

    <div class="movie-card">

        <!-- Thumbnail -->
        <img
            src="thumbnail.jpg"
            class="thumbnail"
            alt="Movie Thumbnail"
        >

        <div class="movie-info">

            <!-- Movie Name -->
            <div class="movie-title">
                My Movie Name
            </div>

            <!-- Movie Details -->
            <div class="details">

                <div class="detail">
                    <div class="label">QUALITY</div>
                    <div class="value">1080p Full HD</div>
                </div>

                <div class="detail">
                    <div class="label">PIXEL</div>
                    <div class="value">1920 × 1080</div>
                </div>

                <div class="detail">
                    <div class="label">FILE SIZE</div>
                    <div class="value">1.5 GB</div>
                </div>

                <div class="detail">
                    <div class="label">FORMAT</div>
                    <div class="value">MP4</div>
                </div>

            </div>

            <!-- Download -->
            <a href="movie.mp4" download="My-Movie-1080p.mp4">
                <button class="download-btn">
                    ⬇ DOWNLOAD MOVIE
                </button>
            </a>

            <div class="note">
                Download will start after pressing the button
            </div>

        </div>

    </div>

</div>

</body>
</html>
